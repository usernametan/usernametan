<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-label="TANUJ. — Software Engineer &amp; Systems Architect. Building deterministic simulations, forensic signal-processing pipelines, and spatial 3D web applications.">
  <defs>
    <!-- Matte Deep Obsidian Base -->
    <linearGradient id="bg-matte" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060609"/>
      <stop offset="55%" stop-color="#0b0b12"/>
      <stop offset="100%" stop-color="#11111a"/>
    </linearGradient>

    <!-- Subtle Violet Shade from Upper Right -->
    <radialGradient id="violet-upper-right" cx="0.88" cy="0.12" r="0.58">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.22"/>
      <stop offset="35%" stop-color="#6d28d9" stop-opacity="0.12"/>
      <stop offset="70%" stop-color="#2e1065" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#060609" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="slate-lower-left" cx="0.14" cy="0.82" r="0.45">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#060609" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="wave-violet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#334155" stop-opacity="0"/>
      <stop offset="40%" stop-color="#64748b" stop-opacity="0.24"/>
      <stop offset="75%" stop-color="#8b5cf6" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#4c1d95" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="wave-slate" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0"/>
      <stop offset="50%" stop-color="#94a3b8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0.12"/>
    </linearGradient>

    <linearGradient id="divider-matte" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a1a1aa" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#060609" stop-opacity="0"/>
    </linearGradient>

    <pattern id="arch-grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#ffffff" stroke-opacity="0.025" stroke-width="1"/>
      <circle cx="0" cy="0" r="0.8" fill="#a1a1aa" fill-opacity="0.14"/>
    </pattern>
  </defs>

  <!-- Matte Base + Upper-Right Violet Blend -->
  <rect width="1200" height="500" fill="url(#bg-matte)"/>
  <rect width="1200" height="500" fill="url(#arch-grid)"/>
  <rect width="1200" height="500" fill="url(#slate-lower-left)"/>
  <rect width="1200" height="500" fill="url(#violet-upper-right)"/>

  <!-- Dynamic Flowing Morphing Waves -->
  <path fill="none" stroke="url(#wave-violet)" stroke-width="1.3">
    <animate attributeName="d"
      values="M 0 390 C 240 330, 480 445, 740 370 C 940 310, 1080 360, 1200 320;
              M 0 370 C 240 430, 480 335, 740 400 C 940 350, 1080 300, 1200 350;
              M 0 390 C 240 330, 480 445, 740 370 C 940 310, 1080 360, 1200 320"
      dur="12s" repeatCount="indefinite"/>
  </path>

  <path fill="none" stroke="url(#wave-slate)" stroke-width="1">
    <animate attributeName="d"
      values="M 0 420 C 280 380, 520 465, 800 405 C 980 365, 1100 405, 1200 375;
              M 0 435 C 280 460, 520 370, 800 430 C 980 400, 1100 360, 1200 400;
              M 0 420 C 280 380, 520 465, 800 405 C 980 365, 1100 405, 1200 375"
      dur="16s" repeatCount="indefinite"/>
  </path>

  <!-- Subtle Matte Corner Brackets -->
  <path d="M 32 60 L 32 32 L 60 32" fill="none" stroke="#52525b" stroke-opacity="0.55" stroke-width="1.4"/>
  <path d="M 1168 60 L 1168 32 L 1140 32" fill="none" stroke="#8b5cf6" stroke-opacity="0.45" stroke-width="1.4"/>
  <path d="M 32 440 L 32 468 L 60 468" fill="none" stroke="#52525b" stroke-opacity="0.55" stroke-width="1.4"/>
  <path d="M 1168 440 L 1168 468 L 1140 468" fill="none" stroke="#52525b" stroke-opacity="0.55" stroke-width="1.4"/>

  <!-- Dynamic 3D-Inspired Wireframe & Kinetic Orbital Structure -->
  <g transform="translate(955, 240)" fill="none">
    <line x1="-175" y1="0" x2="175" y2="0" stroke="#3f3f46" stroke-opacity="0.28" stroke-width="1"/>
    <line x1="0" y1="-175" x2="0" y2="175" stroke="#3f3f46" stroke-opacity="0.28" stroke-width="1"/>

    <g>
      <circle r="154" stroke="#3f3f46" stroke-opacity="0.45" stroke-width="1" stroke-dasharray="12 10"/>
      <circle cx="154" cy="0" r="3.5" fill="#a78bfa" fill-opacity="0.85"/>
      <circle cx="-154" cy="0" r="2.5" fill="#71717a"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="44s" repeatCount="indefinite"/>
    </g>

    <g>
      <circle r="114" stroke="#71717a" stroke-opacity="0.42" stroke-width="1.2" stroke-dasharray="32 14 6 14"/>
      <circle cx="0" cy="-114" r="4" fill="#d4d4d8" fill-opacity="0.85"/>
      <circle cx="0" cy="114" r="3" fill="#8b5cf6" fill-opacity="0.8"/>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="28s" repeatCount="indefinite"/>
    </g>

    <!-- Rotating Wireframe Polyhedron -->
    <g>
      <polygon points="0,-78 68,-39 68,39 0,78 -68,39 -68,-39" stroke="#a78bfa" stroke-opacity="0.38" stroke-width="1.1"/>
      <polygon points="0,-78 68,39 -68,39" stroke="#e4e4e7" stroke-opacity="0.24" stroke-width="0.9"/>
      <polygon points="0,78 68,-39 -68,-39" stroke="#a1a1aa" stroke-opacity="0.24" stroke-width="0.9"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
    </g>

    <g>
      <polygon points="0,-36 30,0 0,36 -30,0" stroke="#71717a" stroke-opacity="0.55" stroke-width="1"/>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="16s" repeatCount="indefinite"/>
    </g>

    <circle cx="0" cy="0" r="6.5" fill="#e4e4e7">
      <animate attributeName="r" values="5.5;8;5.5" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.75;0.95;0.75" dur="3.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="18" stroke="#8b5cf6" stroke-width="1" opacity="0.4">
      <animate attributeName="r" values="14;26;14" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.05;0.45" dur="3.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Floating Ambient Particles -->
  <g fill="#a78bfa">
    <circle cx="680" cy="105" r="1.8" opacity="0.4">
      <animate attributeName="cy" values="105;90;105" dur="5.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.55;0.2" dur="5.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="760" cy="300" r="1.5" fill="#a1a1aa" opacity="0.35">
      <animate attributeName="cy" values="300;284;300" dur="6.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.15;0.45;0.15" dur="6.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1115" cy="120" r="2" opacity="0.45">
      <animate attributeName="cy" values="120;136;120" dur="6.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="6.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Hero Identity & Architectural Typography -->
  <g transform="translate(82, 118)">
    <rect x="0" y="-11" width="276" height="24" rx="12" fill="#18181b" fill-opacity="0.75" stroke="#3f3f46" stroke-opacity="0.65"/>
    <circle cx="15" cy="1" r="3" fill="#a78bfa">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="27" y="5" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" letter-spacing="2.6">USERNAMETAN // ARCHITECT</text>
  </g>

  <text x="82" y="218" fill="#f4f4f5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="82" font-weight="800" letter-spacing="-2">TANUJ.</text>
  <rect x="82" y="242" width="540" height="1.5" fill="url(#divider-matte)"/>
  <text x="82" y="282" fill="#d4d4d8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="15" font-weight="600" letter-spacing="3.2">SOFTWARE ENGINEER &amp; SYSTEMS ARCHITECT</text>
  <text x="82" y="320" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400">Building deterministic simulations, forensic signal-processing pipelines,</text>
  <text x="82" y="346" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400">and spatial 3D web applications.</text>
</svg>
