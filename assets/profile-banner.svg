<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Tanuj — Software Engineer and Systems Architect">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#161616" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a0a0a" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" fill="#0a0a0a"/>
  <rect width="1200" height="320" fill="url(#grid)"/>

  <!-- Subtle architectural scan sweep -->
  <rect x="-300" y="0" width="300" height="320" fill="url(#sweep)">
    <animate attributeName="x" from="-300" to="1200" dur="9s" repeatCount="indefinite"/>
  </rect>

  <!-- Corner brackets -->
  <path d="M 36 56 L 36 36 L 56 36" fill="none" stroke="#525252" stroke-width="1.5"/>
  <path d="M 1164 56 L 1164 36 L 1144 36" fill="none" stroke="#525252" stroke-width="1.5"/>
  <path d="M 36 264 L 36 284 L 56 284" fill="none" stroke="#525252" stroke-width="1.5"/>
  <path d="M 1164 264 L 1164 284 L 1144 284" fill="none" stroke="#525252" stroke-width="1.5"/>

  <!-- Animated Geometric Orbital Emblem -->
  <g transform="translate(990, 160)" fill="none">
    <line x1="-114" y1="0" x2="114" y2="0" stroke="#1f1f1f" stroke-width="1"/>
    <line x1="0" y1="-114" x2="0" y2="114" stroke="#1f1f1f" stroke-width="1"/>

    <g>
      <circle r="94" stroke="#2a2a2a" stroke-width="1.2" stroke-dasharray="18 8 4 8"/>
      <circle cx="94" cy="0" r="3" fill="#737373"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="36s" repeatCount="indefinite"/>
    </g>

    <g>
      <circle r="64" stroke="#404040" stroke-width="1.2" stroke-dasharray="4 6"/>
      <circle cx="64" cy="0" r="4" fill="#fafafa"/>
      <circle cx="-64" cy="0" r="2.5" fill="#737373"/>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="22s" repeatCount="indefinite"/>
    </g>

    <circle r="32" stroke="#525252" stroke-width="1"/>
    <circle cx="0" cy="0" r="6" fill="#fafafa">
      <animate attributeName="r" values="5;7;5" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;1;0.8" dur="3.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Live Status Indicator -->
  <g transform="translate(80, 96)">
    <circle cx="4" cy="4" r="3" fill="#fafafa">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="16" y="8" fill="#737373" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" letter-spacing="3.5">USERNAMETAN // SYSTEMS PORTFOLIO</text>
  </g>

  <!-- Primary Typography -->
  <text x="80" y="164" fill="#fafafa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="56" font-weight="700" letter-spacing="-1">Tanuj</text>
  <rect x="80" y="186" width="480" height="1" fill="url(#fade)"/>
  <text x="80" y="220" fill="#d4d4d4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" letter-spacing="0.3">Software Engineer &amp; Systems Architect</text>
  <text x="80" y="250" fill="#737373" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5" letter-spacing="1.2">DETERMINISTIC SIMULATION · APPLIED DSP/ML · FULL-STACK SYSTEMS · 3D INTERFACES</text>
</svg>
