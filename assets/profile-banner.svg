<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Tanuj — Software Engineer and Systems Architect">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#181818" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a0a0a" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" fill="#0a0a0a"/>
  <rect width="1200" height="320" fill="url(#grid)"/>

  <!-- Subtle architectural corner brackets -->
  <path d="M 36 56 L 36 36 L 56 36" fill="none" stroke="#525252" stroke-width="1.5"/>
  <path d="M 1164 56 L 1164 36 L 1144 36" fill="none" stroke="#525252" stroke-width="1.5"/>
  <path d="M 36 264 L 36 284 L 56 284" fill="none" stroke="#525252" stroke-width="1.5"/>
  <path d="M 1164 264 L 1164 284 L 1144 284" fill="none" stroke="#525252" stroke-width="1.5"/>

  <!-- Geometric orbital emblem on the right -->
  <g transform="translate(990, 160)" fill="none" stroke="#2e2e2e" stroke-width="1.2">
    <circle r="92"/>
    <circle r="62" stroke-dasharray="4 6"/>
    <circle r="32" stroke="#454545"/>
    <line x1="-110" y1="0" x2="110" y2="0" stroke="#222222"/>
    <line x1="0" y1="-110" x2="0" y2="110" stroke="#222222"/>
    <circle cx="62" cy="0" r="4" fill="#e5e5e5" stroke="none"/>
    <circle cx="-44" cy="-44" r="3" fill="#737373" stroke="none"/>
    <circle cx="0" cy="0" r="6" fill="#fafafa" stroke="none"/>
  </g>

  <!-- Primary Typography -->
  <text x="80" y="108" fill="#737373" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" letter-spacing="4">USERNAMETAN // GITHUB PORTFOLIO</text>
  <text x="80" y="168" fill="#fafafa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="54" font-weight="700" letter-spacing="-1">Tanuj</text>
  <rect x="80" y="190" width="460" height="1" fill="url(#fade)"/>
  <text x="80" y="224" fill="#d4d4d4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" letter-spacing="0.3">Software Engineer &amp; Systems Architect</text>
  <text x="80" y="254" fill="#737373" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" letter-spacing="1.2">DETERMINISTIC SIMULATION · APPLIED DSP/ML · FULL-STACK SYSTEMS · 3D INTERFACES</text>
</svg>
