<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="TANUJ. — Software Engineer &amp; Systems Architect. Building deterministic simulations, forensic signal-processing pipelines, and spatial 3D web applications. About: Simulation &amp; Game Systems, Applied DSP &amp; Forensics, Spatial &amp; Local-First Apps.">
  <defs>
    <!-- Deep Matte Obsidian Base -->
    <linearGradient id="bg-obsidian" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#040406"/>
      <stop offset="55%" stop-color="#09090e"/>
      <stop offset="100%" stop-color="#0f0f17"/>
    </linearGradient>

    <!-- Subtle Violet Ambient Shade from Upper Right -->
    <radialGradient id="violet-ur" cx="0.88" cy="0.12" r="0.56">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.18"/>
      <stop offset="40%" stop-color="#6d28d9" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#040406" stop-opacity="0"/>
    </radialGradient>

    <!-- Eclipsed Planet Rim Glow -->
    <radialGradient id="planet-rim" cx="0.62" cy="0.34" r="0.52">
      <stop offset="72%" stop-color="#060609" stop-opacity="1"/>
      <stop offset="93%" stop-color="#d4d4d8" stop-opacity="0.28"/>
      <stop offset="98%" stop-color="#f4f4f5" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#040406" stop-opacity="0"/>
    </radialGradient>

    <!-- Mountain Silhouette Gradient -->
    <linearGradient id="mtn-grad-1" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="45%" stop-color="#141418"/>
      <stop offset="100%" stop-color="#040406"/>
    </linearGradient>

    <linearGradient id="mtn-grad-2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#040406"/>
    </linearGradient>

    <!-- Wireframe Cube Edge Glow -->
    <linearGradient id="cube-edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4f4f5" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#a78bfa" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#71717a" stop-opacity="0.15"/>
    </linearGradient>

    <linearGradient id="floor-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#e4e4e7" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <pattern id="arch-grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="0.8"/>
      <path d="M -3 0 L 3 0 M 0 -3 L 0 3" stroke="#a1a1aa" stroke-opacity="0.18" stroke-width="0.8"/>
    </pattern>
  </defs>

  <!-- Base Layers -->
  <rect width="1200" height="640" fill="url(#bg-obsidian)"/>
  <rect width="1200" height="640" fill="url(#arch-grid)"/>
  <rect width="1200" height="640" fill="url(#violet-ur)"/>

  <!-- Top-Left Tag & Top-Right Architectural Slash -->
  <g transform="translate(46, 44)">
    <rect x="0" y="-8" width="7" height="7" fill="#71717a"/>
    <text x="16" y="-1" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" letter-spacing="3.2">DEVELOP  ·  SIMULATE  ·  INNOVATE</text>
  </g>
  <g transform="translate(1110, 44)" stroke="#d4d4d8" stroke-width="2" stroke-opacity="0.75">
    <line x1="0" y1="4" x2="8" y2="-10"/>
    <line x1="9" y1="4" x2="17" y2="-10"/>
    <line x1="18" y1="4" x2="26" y2="-10"/>
    <line x1="27" y1="4" x2="35" y2="-10"/>
    <circle cx="41" cy="3" r="1.3" fill="#a78bfa" stroke="none"/>
  </g>

  <!-- Left: Eclipsed Rim-Lit Planet -->
  <g transform="translate(175, 255)">
    <circle r="138" fill="#050508" stroke="#e4e4e7" stroke-opacity="0.32" stroke-width="1.2"/>
    <path d="M -30 -134 A 138 138 0 0 1 134 30" fill="none" stroke="#f4f4f5" stroke-opacity="0.65" stroke-width="1.8">
      <animate attributeName="stroke-opacity" values="0.45;0.8;0.45" dur="5s" repeatCount="indefinite"/>
    </path>
    <circle cx="96" cy="-98" r="2.2" fill="#fafafa">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Left: Monochrome Mountain Silhouette -->
  <polygon points="0,640 0,395 45,355 92,382 142,320 198,378 240,365 305,455 375,515 445,565 495,640" fill="url(#mtn-grad-1)" opacity="0.92"/>
  <polygon points="0,640 0,445 78,405 135,440 190,410 265,495 340,560 410,640" fill="url(#mtn-grad-2)" opacity="0.95"/>
  <polyline points="45,355 142,320 198,378 240,365 305,455" fill="none" stroke="#a1a1aa" stroke-opacity="0.28" stroke-width="1"/>

  <!-- Right: Dynamic Isometric 3D Wireframe Architectural Cubes -->
  <g transform="translate(925, 130)">
    <!-- Subtle floating animation on wireframe cluster -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-8; 0,0" dur="7s" repeatCount="indefinite"/>

      <!-- Upper Cube -->
      <polygon points="95,0 195,52 195,180 95,232 -5,180 -5,52" fill="#ffffff" fill-opacity="0.015" stroke="url(#cube-edge)" stroke-width="1.2"/>
      <polyline points="-5,52 95,104 195,52" fill="none" stroke="#e4e4e7" stroke-opacity="0.55" stroke-width="1.1"/>
      <line x1="95" y1="104" x2="95" y2="232" stroke="#e4e4e7" stroke-opacity="0.45" stroke-width="1.1"/>

      <!-- Overlapping Lower-Right Cube -->
      <polygon points="155,118 255,170 255,310 155,362 55,310 55,170" fill="#8b5cf6" fill-opacity="0.02" stroke="#a1a1aa" stroke-opacity="0.38" stroke-width="1.1"/>
      <polyline points="55,170 155,222 255,170" fill="none" stroke="#d4d4d8" stroke-opacity="0.45" stroke-width="1"/>
      <line x1="155" y1="222" x2="155" y2="362" stroke="#d4d4d8" stroke-opacity="0.35" stroke-width="1"/>

      <!-- Perspective Floor Plane -->
      <polygon points="-40,420 155,362 275,410 110,465" fill="#ffffff" fill-opacity="0.015" stroke="#a1a1aa" stroke-opacity="0.22" stroke-width="1"/>

      <!-- Pulsing Vertex Highlights -->
      <circle cx="95" cy="104" r="3" fill="#f4f4f5">
        <animate attributeName="r" values="2.5;4.2;2.5" dur="3.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.5;1;0.5" dur="3.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="155" cy="222" r="2.6" fill="#a78bfa">
        <animate attributeName="r" values="2;3.6;2" dur="4.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.4;0.95;0.4" dur="4.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="95" cy="0" r="2.2" fill="#e4e4e7" opacity="0.7"/>
    </g>
  </g>

  <!-- Subtle Drifting Particles -->
  <g fill="#d4d4d8">
    <circle cx="340" cy="120" r="1.4" opacity="0.4">
      <animate attributeName="cy" values="120;105;120" dur="5.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="840" cy="150" r="1.6" fill="#a78bfa" opacity="0.45">
      <animate attributeName="cy" values="150;135;150" dur="6.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="890" cy="390" r="1.3" opacity="0.35">
      <animate attributeName="cy" values="390;376;390" dur="5.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Centered Hero Identity -->
  <text x="600" y="218" text-anchor="middle" fill="#f4f4f5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="96" font-weight="800" letter-spacing="4">TANUJ.</text>
  <text x="600" y="258" text-anchor="middle" fill="#d4d4d8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14.5" font-weight="500" letter-spacing="5.5">SOFTWARE ENGINEER &amp; SYSTEMS ARCHITECT</text>

  <!-- 4-Point Star Glyph -->
  <path d="M 600 280 L 603 289 L 612 292 L 603 295 L 600 304 L 597 295 L 588 292 L 597 289 Z" fill="none" stroke="#d4d4d8" stroke-opacity="0.75" stroke-width="1.1">
    <animate attributeName="stroke-opacity" values="0.45;0.95;0.45" dur="3.6s" repeatCount="indefinite"/>
  </path>

  <!-- Hero Description -->
  <text x="600" y="336" text-anchor="middle" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16.5">Building deterministic simulations, forensic signal-processing pipelines,</text>
  <text x="600" y="362" text-anchor="middle" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16.5">and spatial 3D web applications.</text>

  <!-- Integrated About Section Divider -->
  <rect x="180" y="400" width="840" height="1" fill="url(#floor-line)"/>
  <text x="600" y="432" text-anchor="middle" fill="#71717a" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" letter-spacing="4">ABOUT // CORE ENGINEERING PILLARS</text>

  <!-- Integrated 3-Column About Pillars -->
  <g transform="translate(130, 466)">
    <!-- Pillar 1 -->
    <g>
      <rect x="0" y="0" width="290" height="96" rx="4" fill="#ffffff" fill-opacity="0.02" stroke="#3f3f46" stroke-opacity="0.45"/>
      <text x="18" y="28" fill="#f4f4f5" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="600" letter-spacing="1.4">01 / SIMULATION &amp; GAMES</text>
      <text x="18" y="54" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5">Fixed-step 60 Hz · Seeded RNG</text>
      <text x="18" y="75" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">Typed event bus · Canvas 2D</text>
    </g>

    <!-- Pillar 2 -->
    <g transform="translate(325, 0)">
      <rect x="0" y="0" width="290" height="96" rx="4" fill="#ffffff" fill-opacity="0.02" stroke="#3f3f46" stroke-opacity="0.45"/>
      <text x="18" y="28" fill="#f4f4f5" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="600" letter-spacing="1.4">02 / DSP &amp; FORENSICS</text>
      <text x="18" y="54" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5">SHA-256 chain of custody · Whisper</text>
      <text x="18" y="75" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">Speaker comparison · Review gates</text>
    </g>

    <!-- Pillar 3 -->
    <g transform="translate(650, 0)">
      <rect x="0" y="0" width="290" height="96" rx="4" fill="#8b5cf6" fill-opacity="0.03" stroke="#8b5cf6" stroke-opacity="0.32"/>
      <text x="18" y="28" fill="#f4f4f5" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="600" letter-spacing="1.4">03 / SPATIAL &amp; LOCAL-FIRST</text>
      <text x="18" y="54" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5">Three.js / WebGL · Offline PWA</text>
      <text x="18" y="75" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">Versioned sync · Spring Boot &amp; FastAPI</text>
    </g>
  </g>

  <!-- Bottom Horizon Glow Line -->
  <rect x="0" y="622" width="1200" height="1" fill="url(#floor-line)"/>
</svg>
